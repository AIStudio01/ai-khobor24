name: Android CI/CD & APK Builder

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (if secret exists)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > my-upload-key.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK & AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.STORE_PASSWORD != ''
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p build-outputs
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-outputs/ \;
          find app/build/outputs/bundle -name "*.aab" -exec cp {} build-outputs/ \;
          cd build-outputs
          sha256sum * > checksums.txt || true
          cat checksums.txt || echo "No outputs generated yet"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-khobor24-build-outputs
          path: build-outputs/

      - name: Create GitHub Release on Tag
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build-outputs/*.apk
            build-outputs/*.aab
            build-outputs/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
