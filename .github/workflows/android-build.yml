name: Android CI/CD & APK Builder

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Setup Keystores (Debug & Release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not configured. Generating temporary release keystore for CI build test..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AI Khobor24, OU=AI, O=AI, L=Kolkata, ST=WB, C=IN" || true
          fi

          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for debugging..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Android, L=US, ST=CA, C=US" || true
          fi

      - name: Build Debug & Release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p build-outputs
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-outputs/ \;
          find app/build/outputs/bundle -name "*.aab" -exec cp {} build-outputs/ \;
          cd build-outputs
          sha256sum * > checksums.txt || true
          cat checksums.txt || echo "No outputs generated yet"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-khobor24-build-outputs
          path: build-outputs/

      - name: Create GitHub Release on Tag
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build-outputs/*.apk
            build-outputs/*.aab
            build-outputs/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
